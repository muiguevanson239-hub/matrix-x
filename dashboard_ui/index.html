<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Matrix X</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b0f19;
    color: white;
}

.topbar {
    display:flex;
    justify-content:space-between;
    padding:15px;
    background:#111827;
}

.brand { color:#38bdf8; font-weight:bold; }

.container {
    display:grid;
    grid-template-columns: 1fr 2fr 1fr;
    height: calc(100vh - 60px);
}

.panel {
    padding:10px;
    border-right:1px solid #1f2937;
}

.chat {
    display:flex;
    flex-direction:column;
    padding:10px;
}

.messages {
    flex:1;
    overflow-y:auto;
}

.msg {
    margin:5px;
    padding:10px;
    border-radius:6px;
}

.user { background:#2563eb; margin-left:auto; }
.ai { background:#1f2937; }

.input {
    display:flex;
}

input {
    flex:1;
    padding:10px;
}

button {
    padding:10px;
    background:#38bdf8;
    border:none;
}

.plan {
    background:#1f2937;
    padding:5px 10px;
    border-radius:20px;
}
</style>
</head>

<body>

<div class="topbar">
    <div class="brand">⚡ Matrix X</div>
    <div class="plan" id="plan">FREE</div>
</div>

<div class="container">

<!-- LEFT -->
<div class="panel">
<h3>🧠 Memory</h3>
<div id="memory"></div>
</div>

<!-- CHAT -->
<div class="chat">
<div class="messages" id="messages"></div>

<div class="input">
<input id="input" placeholder="Ask Matrix X...">
<button onclick="send()">Send</button>
</div>
</div>

<!-- RIGHT -->
<div class="panel">
<h3>⚙ System</h3>
<button onclick="loadMemory()">Refresh Memory</button>
</div>

</div>

<script>

let token = localStorage.getItem("token") || "";

async function send() {

    let input = document.getElementById("input");
    let msg = input.value;
    if (!msg) return;

    add(msg, "user");
    input.value = "";

    let res = await fetch("/chat/send", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            token,
            session_id:"ui",
            message:msg
        })
    });

    let data = await res.json();

    add(data.response || "error", "ai");
}

function add(text, type) {
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    document.getElementById("messages").appendChild(div);
}

async function loadMemory() {

    let res = await fetch("/memory?token=" + token);
    let data = await res.json();

    let box = document.getElementById("memory");
    box.innerHTML = "";

    (data.memory || []).forEach(m => {
        let div = document.createElement("div");
        div.innerText = m.content || m;
        box.appendChild(div);
    });
}

loadMemory();

</script>

</body>
</html>
